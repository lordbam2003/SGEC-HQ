<VirtualHost *:80>
    ServerName costeo.tudominio.com
    # ServerAlias www.costeo.tudominio.com
    ServerAdmin admin@tudominio.com

    # Logs de acceso y error
    ErrorLog ${APACHE_LOG_DIR}/costeo_error.log
    CustomLog ${APACHE_LOG_DIR}/costeo_access.log combined

    # Permitir carga de archivos grandes (Catálogos Excel, SIGA, CPMS hasta 50MB)
    LimitRequestBody 52428800

    # Configuración de Proxy Inverso hacia FastAPI / Uvicorn
    ProxyPreserveHost On
    ProxyRequests Off

    # Reenvío de encabezados para identificar correctamente IP y protocolo
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
    RequestHeader set X-Forwarded-Port expr=%{SERVER_PORT}
    RequestHeader set X-Forwarded-For %{REMOTE_ADDR}e

    # Soporte para WebSockets (si se utilizan canales en tiempo real)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*)           ws://127.0.0.1:8050/$1 [P,L]
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]

    # Proxy para todas las peticiones (API + Frontend SPA)
    ProxyPass / http://127.0.0.1:8050/ timeout=300
    ProxyPassReverse / http://127.0.0.1:8050/

    # Compresión gzip para mejorar rendimiento de la SPA
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json
    </IfModule>
</VirtualHost>
