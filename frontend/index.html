<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGEC-HQ | Sistema de Gestión de Estructuras de Costo - Hospital Quillabamba</title>
  
  <!-- Estilos Principales y Componentes -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  
  <link rel="icon" type="image/png" href="hospital-quillabamba-logo.png">
</head>
<body>
  <div id="app-layout">
    <!-- Barra Lateral de Navegación -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="brand-logo-wrap" title="Hospital Quillabamba">
          <img src="hospital-quillabamba-logo.png" alt="Hospital Quillabamba" class="brand-logo-img">
        </div>
        <div class="brand-text">
          <h1>SGEC-HQ</h1>
          <p>Hospital Quillabamba</p>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">Principal</div>
        <a class="nav-item active" data-view="dashboard">
          <span class="nav-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
          </span>
          Panel General
        </a>

        <a class="nav-item" data-view="sheets">
          <span class="nav-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></svg>
          </span>
          Hojas de Costeo
        </a>

        <a class="nav-item" data-view="studio">
          <span class="nav-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg>
          </span>
          Costing Studio (Editor)
        </a>

        <div class="nav-section-title">Formatos & Reportes</div>
        <a class="nav-item" data-view="matrix">
          <span class="nav-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18"/><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/></svg>
          </span>
          Matriz Resumen
        </a>

        <a class="nav-item" data-view="tariffs">
          <span class="nav-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z"/><path d="M7 7h.01"/></svg>
          </span>
          Propuesta Tarifaria
        </a>

        <a class="nav-item" data-view="market">
          <span class="nav-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
          </span>
          Estudio de Mercado
        </a>

        <div class="nav-section-title">Configuración</div>
        <a class="nav-item" data-view="catalogs">
          <span class="nav-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/></svg>
          </span>
          Catálogos & Actualización
        </a>

        <a class="nav-item" data-view="users" id="nav-item-users" style="display: none;">
          <span class="nav-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </span>
          Gestión de Usuarios
        </a>
      </nav>

      <div class="sidebar-footer" title="Hospital Quillabamba - Un Compromiso Por La Vida">
        <span style="font-size: 0.73rem; opacity: 0.85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Un Compromiso Por La Vida</span>
        <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #00a8cc; flex-shrink: 0;" title="SGEC-HQ Operativo"></span>
      </div>
    </aside>

    <!-- Área Principal de Trabajo -->
    <div id="main-wrapper">
      <!-- Cabecera Superior -->
      <header id="header">
        <div class="header-left">
          <button id="btn-toggle-sidebar" class="btn-toggle-sidebar" title="Ocultar / Mostrar Menú" onclick="App.toggleSidebar()">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
          </button>
          <span class="page-title-badge" id="header-view-badge">Panel General</span>
        </div>
        <div class="header-right" id="header-actions-area" style="display: flex; align-items: center; gap: 0.75rem;">
          <button class="btn btn-secondary btn-sm" onclick="App.navigate('catalogs')">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
            Actualizar Catálogo CPMS
          </button>
          <button class="btn btn-primary btn-sm" onclick="App.navigate('studio')">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
            Nuevo Procedimiento
          </button>
          
          <!-- Widget Perfil de Usuario & Logout -->
          <div id="header-user-profile" style="display: flex; align-items: center; gap: 0.5rem; margin-left: 0.5rem; padding-left: 0.75rem; border-left: 1px solid var(--border-color);">
          </div>
        </div>
      </header>

      <!-- Contenedor Dinámico de Vistas -->
      <main id="content-container">
        <!-- Contenido inyectado por App Router -->
      </main>
    </div>
  </div>

  <!-- Scripts JavaScript (Vanilla JS Limpio) -->
  <script src="js/components/icons.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/api.js"></script>
  <script src="js/views/login_view.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/costing_sheets_view.js"></script>
  <script src="js/views/costing_studio.js"></script>
  <script src="js/views/matrix_view.js"></script>
  <script src="js/views/tariff_view.js"></script>
  <script src="js/views/market_view.js"></script>
  <script src="js/views/catalogs_view.js"></script>
  <script src="js/views/users_view.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
